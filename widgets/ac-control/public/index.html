<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    /* accent is driven by the active mode (set from JS); glow derives from it */
    --accent:  var(--homey-color-blue-400, #38bdf8);
    --accent-2:var(--homey-color-blue-300, #22d3ee);
    --glow:    color-mix(in srgb, var(--accent) 55%, transparent);

    /* neutrals — Homey design tokens when running in the dashboard,
       cool-biased slate fallbacks elsewhere (previews, dev).
       --ink is the theme's max-contrast mono; subtle fills derive from it. */
    --ink:       var(--homey-color-mono-1000, #ffffff);
    --surface-1: var(--homey-background-color, #141d27);
    --surface-2: #0e151d;
    --card-edge: var(--homey-line-color-light, rgba(255,255,255,.06));
    --text:      var(--homey-text-color, #eaf2f8);
    --muted:     var(--homey-text-color-light, #7d8f9c);
    --track:     color-mix(in srgb, var(--ink) 8%, transparent);
    --btn:       color-mix(in srgb, var(--ink) 4.5%, transparent);
    --btn-edge:  color-mix(in srgb, var(--ink) 9%, transparent);
    --chip:      color-mix(in srgb, var(--ink) 3.5%, transparent);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink:       var(--homey-color-mono-1000, #0e1e2d);
      --surface-1: var(--homey-background-color, #ffffff);
      --surface-2: #f2f6f9;
      --card-edge: var(--homey-line-color-light, rgba(12,26,38,.08));
      --text:      var(--homey-text-color, #12212c);
      --muted:     var(--homey-text-color-light, #5f7180);
    }
  }
  /* the Homey dashboard signals dark mode with this class, independent of
     the OS prefers-color-scheme — it must win over the media query above */
  .homey-dark-mode {
    --ink:       var(--homey-color-mono-1000, #ffffff);
    --surface-1: var(--homey-background-color, #141d27);
    --surface-2: #0e151d;
    --card-edge: var(--homey-line-color-light, rgba(255,255,255,.06));
    --text:      var(--homey-text-color, #eaf2f8);
    --muted:     var(--homey-text-color-light, #7d8f9c);
  }
  /* forced themes for preview screenshots (tokens absent there) */
  :root[data-theme="dark"] {
    --ink:#ffffff; --surface-1:#141d27; --surface-2:#0e151d;
    --card-edge:rgba(255,255,255,.06); --text:#eaf2f8; --muted:#7d8f9c;
  }
  :root[data-theme="light"] {
    --ink:#0e1e2d; --surface-1:#ffffff; --surface-2:#f2f6f9;
    --card-edge:rgba(12,26,38,.08); --text:#12212c; --muted:#5f7180;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; overscroll-behavior: none; }
  /* font on html so Homey's injected body/class font rules win when present */
  html { font-family: var(--homey-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  body {
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: var(--homey-font-size-small, 14px);
    padding: 4px; /* room for the card's shadow */
    user-select: none;
    -webkit-user-select: none;
  }
  button { font-family: inherit; }

  /* the widget runs transparent and paints its own card, matching Homey
     device tiles: the standard background color with a hairline border and
     soft shadow; on turns white (both themes) like an active tile */
  .widget {
    width: 100%;
    border-radius: var(--homey-border-radius-default, 20px);
    padding: var(--homey-su-5, 20px);
    position: relative;
    overflow: hidden;
    color: var(--text); /* re-resolve inside the on/off palette override */
    background: var(--surface-1);
    border: 1px solid var(--card-edge);
    box-shadow: 0 2px 5px -2px rgba(0,0,0,.22);
    transition: background .5s ease;
  }
  .widget[data-on="false"] {
    --accent: var(--muted);
    --accent-2: var(--muted);
  }
  .widget[data-on="true"] {
    background: #ffffff;
    --ink: #0e1e2d;
    --surface-1: #ffffff;
    --card-edge: rgba(12,26,38,.08);
    --text: #12212c;
    --muted: #5f7180;
  }

  /* ambient airflow canvas sits behind content */
  #air { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  .widget[data-on="true"] #air { opacity: 1; }
  .content { position: relative; z-index: 1; }

  /* header ------------------------------------------------------- */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .device  { font-size: var(--homey-font-size-default, 18px); font-weight: var(--homey-font-weight-bold, 650); letter-spacing: -.01em; margin-top: 3px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
  .status  {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 6px 11px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--card-edge);
    white-space: nowrap;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .widget[data-on="true"] .status { color: var(--accent); }
  .widget[data-on="true"] .status .dot { background: var(--accent); box-shadow: 0 0 0 0 var(--glow); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 var(--glow);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }

  /* dial --------------------------------------------------------- */
  .dial { position: relative; width: 228px; height: 228px; margin: 6px auto 2px; touch-action: none; }
  .dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .track  { fill: none; stroke: var(--track); stroke-width: 13; stroke-linecap: round; }
  .progress { fill: none; stroke: url(#grad); stroke-width: 13; stroke-linecap: round;
              filter: drop-shadow(0 0 10px var(--glow)); transition: stroke .5s ease; }
  .widget[data-on="false"] .progress { filter: none; opacity: .5; }
  .knob   { fill: var(--surface-1); stroke: var(--accent); stroke-width: 4;
            cursor: grab; transition: stroke .5s ease; }
  .dial.dragging .knob { cursor: grabbing; }

  .readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .temp { font-size: 60px; font-weight: 600; letter-spacing: -.03em; line-height: .9;
          font-variant-numeric: tabular-nums; transition: color .5s ease; }
  .temp .unit { font-size: 21px; font-weight: 550; color: var(--muted); vertical-align: super; margin-left: 2px; }
  .sub { margin-top: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .widget[data-on="true"] .temp { color: var(--text); }
  .widget[data-on="false"] .temp { color: var(--muted); }

  /* +/- big steppers, flanking the dial --------------------------- */
  .stepwrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 2px; }
  .step {
    width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid var(--btn-edge); background: var(--btn); color: var(--text);
    font-size: 26px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .step:active { transform: scale(.92); background: color-mix(in srgb, var(--accent) 16%, var(--btn)); }
  .step svg { width: 22px; height: 22px; }
  .stephint { min-width: 92px; text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* mode chips --------------------------------------------------- */
  .modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--homey-su-2, 8px); margin-top: var(--homey-su-4, 16px); }
  .mode {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 2px 8px; border-radius: 15px; cursor: pointer;
    background: var(--chip); border: 1px solid transparent; color: var(--muted);
    transition: color .2s ease, background .2s ease, border-color .2s ease, transform .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mode svg { width: var(--homey-icon-size-medium, 20px); height: var(--homey-icon-size-medium, 20px); }
  .mode span { font-size: 9.5px; letter-spacing: .04em; font-weight: 650; text-transform: uppercase; }
  .mode:active { transform: scale(.95); }
  .mode[aria-pressed="true"] {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  /* fan speed ---------------------------------------------------- */
  .row-label { display: flex; align-items: center; gap: var(--homey-su-2, 8px); margin: var(--homey-su-4, 16px) 2px var(--homey-su-2, 9px); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .row-label svg { width: var(--homey-icon-size-small, 14px); height: var(--homey-icon-size-small, 14px); }
  .fan { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
         background: var(--chip); border: 1px solid var(--card-edge); border-radius: 14px; padding: 5px; }
  .fanbtn {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    padding: 9px 0; border-radius: 10px; font-size: 10px; font-weight: 650; letter-spacing: .02em;
    transition: color .2s ease, background .25s ease; -webkit-tap-highlight-color: transparent;
  }
  .fanbtn[aria-pressed="true"] { color: #08121a; background: var(--accent); }

  /* power -------------------------------------------------------- */
  .power {
    margin-top: var(--homey-su-4, 16px); width: 100%; height: 54px; border-radius: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: var(--homey-su-2, 10px);
    font-size: var(--homey-font-size-small, 15px); font-weight: var(--homey-font-weight-medium, 650); letter-spacing: .01em;
    border: 1px solid var(--btn-edge); background: var(--btn); color: var(--text);
    transition: transform .12s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .power svg { width: 19px; height: 19px; }
  .power:active { transform: scale(.98); }
  .widget[data-on="true"] .power {
    color: #06101a;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border-color: transparent;
    box-shadow: 0 12px 30px -12px var(--glow);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    #air { display: none; }
  }
</style>
</head>
<body>

<div class="widget" data-on="false" id="widget">
  <canvas id="air"></canvas>
  <div class="content">
    <header>
      <div>
        <div class="eyebrow">Mitsubishi Electric</div>
        <div class="device" id="deviceName">Air Conditioner</div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Off</span></div>
    </header>

    <div class="dial" id="dial">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--accent-2)"/>
            <stop offset="1" stop-color="var(--accent)"/>
          </linearGradient>
        </defs>
        <path class="track" id="track"></path>
        <path class="progress" id="prog"></path>
        <circle class="knob" id="knob" r="11"></circle>
      </svg>
      <div class="readout">
        <div class="temp"><span id="tempVal">22</span><span class="unit">°C</span></div>
        <div class="sub"><span id="subMode">Cool</span> · Room <span id="roomVal">—</span>°</div>
      </div>
    </div>

    <div class="stepwrap">
      <button class="step" id="down" aria-label="Lower temperature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <div class="stephint">Target Temp</div>
      <button class="step" id="up" aria-label="Raise temperature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="modes" id="modes" role="group" aria-label="Mode"></div>

    <div class="row-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12c0-3 2-5 5-5 0 3-2 5-5 5Zm0 0c0 3-2 5-5 5 0-3 2-5 5-5Zm0 0c-3 0-5-2-5-5 3 0 5 2 5 5Zm0 0c3 0 5 2 5 5-3 0-5-2-5-5Z"/></svg>
      Fan Speed
    </div>
    <div class="fan" id="fan" role="group" aria-label="Fan speed"></div>

    <button class="power" id="power">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v8"/><path d="M7.5 7a7 7 0 1 0 9 0"/></svg>
      <span id="powerText">Turn On</span>
    </button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---- config ------------------------------------------------------------
  // The ECHONET protocol carries whole degrees only, so step by 1.
  const MIN = 16, MAX = 31, STEP = 1;
  const SWEEP = 270, A0 = -135, A1 = 135;   // gauge spans 270°, gap at bottom
  const CX = 120, CY = 120, R = 100;
  const POLL_MS = 5000;
  const LOCAL_GRACE_MS = 4000; // ignore polled state right after a local change

  // Accents prefer Homey design tokens (present in the dashboard webview)
  // and fall back to our palette; auto keeps indigo — Homey has no purple token.
  const MODES = {
    cool: { label: "Cool", a: "var(--homey-color-blue-400, #38bdf8)", a2: "var(--homey-color-blue-300, #22d3ee)",
      icon: `<path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9" stroke-linecap="round"/>` },
    heat: { label: "Heat", a: "var(--homey-color-orange-500, #fb923c)", a2: "#f59e0b",
      icon: `<path d="M12 3c2 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.6-2.7 1.4-3.6C10 8.5 11 6.5 12 3Z"/>` },
    dry:  { label: "Dry",  a: "var(--homey-color-green-500, #34d399)", a2: "#2dd4bf",
      icon: `<path d="M12 3c3 4 5 6.5 5 9.5A5 5 0 0 1 7 12.5C7 9.5 9 7 12 3Z"/>` },
    fan:  { label: "Fan",  a: "var(--homey-color-mono-400, #93a4b3)", a2: "#c3d0da",
      icon: `<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 10.4c0-3 2-5 5-5 0 3-2 5-5 5Zm0 3.2c0 3-2 5-5 5 0-3 2-5 5-5Zm-1.6-1.6c-3 0-5-2-5-5 3 0 5 2 5 5Zm3.2 0c3 0 5 2 5 5-3 0-5-2-5-5Z"/>` },
    auto: { label: "Auto", a: "#818cf8", a2: "#a78bfa",
      icon: `<path d="M7.5 18l4.5-12 4.5 12M9 14h6" stroke-linecap="round" stroke-linejoin="round"/>` },
  };
  // Matches the fan_speed capability values; speed drives the airflow animation.
  const FANS = [
    { key: "auto",   label: "AUTO",  speed: 1.0 },
    { key: "quiet",  label: "QUIET", speed: 0.5 },
    { key: "low",    label: "LOW",   speed: 0.7 },
    { key: "medium", label: "MED",   speed: 1.0 },
    { key: "high",   label: "HIGH",  speed: 1.5 },
    { key: "max",    label: "MAX",   speed: 2.0 },
  ];

  // ---- state -------------------------------------------------------------
  const state = { on: false, mode: "cool", target: 22, room: null, outdoor: null, fan: "auto", name: "Air Conditioner" };
  let homeyApi = null;      // set in onHomeyReady
  let haptic = () => {};    // becomes Homey.hapticFeedback in onHomeyReady
  let deviceId = null;
  let lastLocalChange = 0;
  let dragging = false;

  // Standalone/preview support (used for the store preview screenshots).
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
  if (params.has("preview")) { state.on = true; state.room = 24; state.name = "Living Room"; }

  // ---- geometry helpers --------------------------------------------------
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const frac  = () => (state.target - MIN) / (MAX - MIN);
  const angleOf = f => A0 + f * SWEEP;

  function polar(a) {
    const r = a * Math.PI / 180;
    return { x: CX + R * Math.sin(r), y: CY - R * Math.cos(r) };
  }
  function arcPath(a0, a1) {
    const s = polar(a0), e = polar(a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
  }

  // ---- elements ----------------------------------------------------------
  const el = id => document.getElementById(id);
  const widget = el("widget");
  el("track").setAttribute("d", arcPath(A0, A1));

  // build mode chips
  const modesBox = el("modes");
  for (const key of Object.keys(MODES)) {
    const m = MODES[key];
    const b = document.createElement("button");
    b.className = "mode"; b.type = "button"; b.dataset.mode = key;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${m.icon}</svg><span>${m.label}</span>`;
    b.addEventListener("click", () => {
      state.mode = key;
      if (!state.on) state.on = true; // the driver powers on when a mode is set
      haptic(); touch(); render(); push("/mode", key);
    });
    modesBox.appendChild(b);
  }
  // build fan buttons
  const fanBox = el("fan");
  for (const f of FANS) {
    const b = document.createElement("button");
    b.className = "fanbtn"; b.type = "button"; b.dataset.fan = f.key; b.textContent = f.label;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { state.fan = f.key; haptic(); touch(); render(); push("/fan", f.key); });
    fanBox.appendChild(b);
  }

  // ---- render ------------------------------------------------------------
  let accentColor = "#38bdf8"; // resolved accent for the canvas (can't parse var())
  function render() {
    const m = MODES[state.mode] || MODES.cool;
    const root = document.documentElement;
    root.style.setProperty("--accent", m.a);
    root.style.setProperty("--accent-2", m.a2);
    accentColor = getComputedStyle(root).getPropertyValue("--accent").trim() || accentColor;

    widget.dataset.on = String(state.on);

    // dial
    const a = angleOf(clamp(frac(), 0, 1));
    el("prog").setAttribute("d", arcPath(A0, a));
    const k = polar(a);
    el("knob").setAttribute("cx", k.x.toFixed(2));
    el("knob").setAttribute("cy", k.y.toFixed(2));

    // readout
    const t = state.target;
    el("tempVal").textContent = Number.isInteger(t) ? t : t.toFixed(1);
    el("subMode").textContent = m.label;
    el("roomVal").textContent = state.room == null ? "—" : Number(state.room).toFixed(1).replace(/\.0$/, "");

    // status pill
    const verb = { cool: "Cooling", heat: "Heating", dry: "Drying", fan: "Fan", auto: "Auto" }[state.mode] || "On";
    el("statusText").textContent = state.on ? verb : "Off";

    el("deviceName").textContent = state.name;

    // mode chips
    modesBox.querySelectorAll(".mode").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    // fan
    fanBox.querySelectorAll(".fanbtn").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.fan === state.fan)));

    el("powerText").textContent = state.on ? "Turn Off" : "Turn On";
  }

  // ---- interactions ------------------------------------------------------
  function setTemp(v) {
    const nv = clamp(Math.round(v / STEP) * STEP, MIN, MAX);
    if (nv !== state.target) { state.target = nv; touch(); render(); pushTemp(); }
  }

  el("up").addEventListener("click", () => { haptic(); setTemp(state.target + STEP); });
  el("down").addEventListener("click", () => { haptic(); setTemp(state.target - STEP); });
  el("power").addEventListener("click", () => { state.on = !state.on; haptic(); touch(); render(); push("/onoff", state.on); });

  // drag on the dial
  const dial = el("dial");
  function pointToTemp(ev) {
    const r = dial.getBoundingClientRect();
    const scale = 240 / r.width;
    const px = (ev.clientX - r.left) * scale;
    const py = (ev.clientY - r.top) * scale;
    let ang = Math.atan2(px - CX, -(py - CY)) * 180 / Math.PI; // 0 = top, clockwise
    ang = clamp(ang, A0, A1); // ignore the dead zone in the bottom gap
    setTemp(MIN + ((ang - A0) / SWEEP) * (MAX - MIN));
  }
  dial.addEventListener("pointerdown", ev => {
    dragging = true; dial.classList.add("dragging"); haptic();
    dial.setPointerCapture(ev.pointerId); pointToTemp(ev); ev.preventDefault();
  });
  dial.addEventListener("pointermove", ev => { if (dragging) pointToTemp(ev); });
  const endDrag = () => { dragging = false; dial.classList.remove("dragging"); };
  dial.addEventListener("pointerup", endDrag);
  dial.addEventListener("pointercancel", endDrag);
  // some webviews ignore touch-action and try to scroll mid-drag
  dial.addEventListener("touchstart", ev => ev.preventDefault(), { passive: false });
  dial.addEventListener("touchmove", ev => ev.preventDefault(), { passive: false });

  // ---- airflow animation -------------------------------------------------
  const canvas = el("air"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, parts = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = widget.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn() {
    parts = Array.from({ length: 26 }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.55,
      len: 30 + Math.random() * 70, v: 0.4 + Math.random() * 1.1,
      amp: 4 + Math.random() * 10, ph: Math.random() * Math.PI * 2,
      w: 0.6 + Math.random() * 1.4, o: 0.05 + Math.random() * 0.14,
    }));
  }
  let tick = 0;
  function frame() {
    requestAnimationFrame(frame);
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    if (widget.dataset.on !== "true") return;
    tick += 0.016;
    const fan = FANS.find(f => f.key === state.fan);
    const speed = fan ? fan.speed : 1;
    const dir = state.mode === "heat" ? -1 : 1; // heat drifts up-ish
    for (const p of parts) {
      p.x += p.v * speed;
      if (p.x - p.len > W) { p.x = -p.len; p.y = Math.random() * H * 0.6; }
      const yy = p.y + Math.sin(tick * p.v + p.ph) * p.amp + dir * 6;
      ctx.beginPath();
      ctx.moveTo(p.x, yy);
      ctx.bezierCurveTo(p.x - p.len * 0.4, yy - p.amp, p.x - p.len * 0.6, yy + p.amp, p.x - p.len, yy);
      ctx.strokeStyle = accentColor;
      ctx.globalAlpha = p.o * Math.min(speed, 1.4);
      ctx.lineWidth = p.w; ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    resize(); spawn();
    window.addEventListener("resize", () => { resize(); spawn(); });
    requestAnimationFrame(frame);
  }

  // ---- Homey integration ---------------------------------------------------
  function touch() { lastLocalChange = Date.now(); }

  function push(path, value) {
    if (!homeyApi || !deviceId) return;
    homeyApi("POST", `${path}?deviceId=${encodeURIComponent(deviceId)}`, { value })
      .catch(err => console.error(`POST ${path} failed`, err));
  }
  function pushTemp() {
    // debounce dial drags so we don't spam the AC with UDP sets
    clearTimeout(pushTemp._t);
    pushTemp._t = setTimeout(() => push("/target", state.target), 350);
  }

  function pullState() {
    if (!homeyApi || !deviceId) return;
    homeyApi("GET", `/state?deviceId=${encodeURIComponent(deviceId)}`)
      .then(s => {
        if (!s) return;
        // don't fight the user's in-flight changes
        if (dragging || Date.now() - lastLocalChange < LOCAL_GRACE_MS) return;
        if (typeof s.name === "string") state.name = s.name;
        if (typeof s.on === "boolean") state.on = s.on;
        if (typeof s.target === "number") state.target = clamp(s.target, MIN, MAX);
        if (typeof s.room === "number") state.room = s.room;
        if (typeof s.outdoor === "number") state.outdoor = s.outdoor;
        if (s.mode && MODES[s.mode]) state.mode = s.mode;
        if (s.fan && FANS.some(f => f.key === s.fan)) state.fan = s.fan;
        render();
        if (s.available === false) el("statusText").textContent = "Unreachable";
      })
      .catch(err => console.error("GET /state failed", err));
  }

  render();

  window.onHomeyReady = function onHomeyReady(Homey) {
    homeyApi = Homey.api.bind(Homey);
    if (typeof Homey.hapticFeedback === "function") {
      haptic = () => { try { Homey.hapticFeedback(); } catch (e) { /* outside touch window */ } };
    }
    deviceId = (Homey.getDeviceIds() || [])[0] || null;

    if (!deviceId) {
      el("statusText").textContent = "No device";
      el("deviceName").textContent = "Select a device";
    } else {
      pullState();
      setInterval(pullState, POLL_MS);
    }

    Homey.ready({ height: document.body.offsetHeight });
  };
})();
</script>

</body>
</html>
